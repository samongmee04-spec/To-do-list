<style>
  :root{
    --bg:#FEE2BF; --surface:#FEECD5; --sh-dark:#D5BEA0; --sh-light:#FFFFFF;
    --ink:#5A674F; --ink-soft:#99A192; --urgent-deep:#D1A918;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Prompt',sans-serif;font-weight:300;
    min-height:100vh;-webkit-tap-highlight-color:transparent;
  }
  .q{max-width:460px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .q-top{width:100%;display:flex;justify-content:space-between;align-items:center;}
  .q-title{font-weight:600;font-size:1.25rem;}
  .q-open{color:var(--ink-soft);font-size:.85rem;text-decoration:none;font-weight:400;}
  .q-status{margin:26px 0 18px;text-align:center;font-size:.95rem;min-height:2.6em;line-height:1.45;color:var(--ink);}
  .q-mic{
    width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;
    background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:10px 10px 20px var(--sh-dark), -10px -10px 20px var(--sh-light);
  }
  .q-mic svg{width:56px;height:56px;}
  .q-mic.on{background:var(--urgent-deep);color:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(209,169,24,.55);}70%{box-shadow:0 0 0 28px rgba(209,169,24,0);}100%{box-shadow:0 0 0 0 rgba(209,169,24,0);}}
  .q-heard{
    width:100%;margin-top:26px;min-height:3.2em;padding:12px 16px;border-radius:18px;font-size:.92rem;line-height:1.5;
    background:var(--surface);color:var(--ink);word-break:break-word;
    box-shadow:inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
  }
  .q-heard:empty::before{content:'ข้อความที่ได้ยินจะขึ้นที่นี่';color:var(--ink-soft);}
  .q-result{width:100%;margin-top:18px;}
  .q-item{
    display:flex;gap:10px;align-items:flex-start;padding:11px 14px;margin-bottom:10px;border-radius:16px;
    background:var(--surface);font-size:.92rem;line-height:1.4;word-break:break-word;
    box-shadow:5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
  }
  .q-tag{flex:none;font-size:.7rem;font-weight:500;padding:3px 9px;border-radius:10px;color:var(--ink);
    box-shadow:inset 2px 2px 4px var(--sh-dark), inset -2px -2px 4px var(--sh-light);white-space:nowrap;}
  .q-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .q-btn{
    border:none;border-radius:16px;padding:10px 18px;font-family:'Prompt',sans-serif;font-size:.85rem;font-weight:500;
    color:var(--ink);background:var(--surface);cursor:pointer;
    box-shadow:5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
  }
  .q-btn:active{box-shadow:inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);}
  .q-hint{margin-top:26px;font-size:.74rem;color:var(--ink-soft);line-height:1.6;text-align:center;}
</style>

<div class="q">
  <div class="q-top">
    <div class="q-title">⚡ จดด่วน</div>

  </div>

  </div>
  <div class="q-hint">พูดจำนวนเงินจะเข้า Pocket เช่น “BTS เช้า 47 บาท ต่อไป ข้าวเที่ยง 60 บาท”<br>พูดชื่อลิสต์นำหน้าได้ เช่น “ด่วน ทำป้าย ต่อไป งานวันนี้ บันทึกรายงาน”<br>ถ้าไม่พูดชื่อลิสต์ จะเข้าช่อง “จดด่วน (รอแยก)” ให้มาย้ายทีหลังในแอป</div>

<script>

const VOICE_GROUPS = [
  {key:'inbox',     label:'จดด่วน (รอแยก)', tab:null},
  {key:'urgent',    label:'ด่วน!',          tab:'office'},
  {key:'today',     label:'งานวันนี้',       tab:'office'},
  {key:'important', label:'เรื่องสำคัญ',     tab:'myself'},
  {key:'shopping',  label:'ของต้องซื้อ',     tab:'myself'},
  {key:'exercise',  label:'ออกกำลังกาย',     tab:'myself'},
  {key:'pocket',    label:'💰 Pocket',       tab:null}
];
const VOICE_ALIASES = [
  {key:'shopping',  re:/(?:รายการ\s*(?:ที่\s*)?ต้องซื้อ|ลิ[สท]ต?์?\s*(?:ที่\s*)?ต้องซื้อ|ของ\s*(?:ที่\s*)?ต้องซื้อ|ลิ[สท]ต?์?\s*ซื้อของ|ช็?อปปิ้ง|ช้อปปิ้ง|shopping(?:\s*list)?)/i},
  {key:'urgent',    re:/(?:เรื่องด่วน|งานด่วน|ด่วนมาก|ต้องทำเลย|ด่วน|urgent)/i},
  {key:'important', re:/(?:เรื่องสำคัญ|งานสำคัญ|ลิ[สท]ต?์?สำคัญ|รายการสำคัญ|important)/i},
  {key:'exercise',  re:/(?:ออกกำลังกาย|เวิร์ค?เอาท์|workout|exercise)/i},
  {key:'today',     re:/(?:งานวันนี้|เรื่องวันนี้|ลิ[สท]ต?์?วันนี้|ของวันนี้)/i}
];
const VOICE_UNITS = 'ด้าม|แท่ง|อัน|ชิ้น|กล่อง|ขวด|แพ็ค|แพค|แพ็ก|ห่อ|ถุง|ใบ|เล่ม|แผ่น|ลูก|ตัว|คู่|ชุด|โหล|กระป๋อง|ถัง|กิโลกรัม|กิโล|กก\\.?|กรัม|ลิตร|ซอง|หลอด|ม้วน|เส้น|ต้น|คัน|หัว|ฟอง|แก้ว|จาน|ชาม|ถ้วย|เม็ด|มัด|กำ|ก้อน|ที่|pcs';
const VOICE_NUM = {'หนึ่ง':1,'สอง':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9,'สิบ':10};

function voiceNormalize(s){
  s = String(s||'').replace(/[๐-๙]/g, d=> String('๐๑๒๓๔๕๖๗๘๙'.indexOf(d)));
  s = s.replace(/[“”"]/g,'');
  s = s.replace(new RegExp('(หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ)\\s*('+VOICE_UNITS+')','g'), (m,n,u)=> VOICE_NUM[n]+' '+u);
  s = s.replace(/([ก-๙])(\d)/g,'$1 $2').replace(/(\d)([ก-๙])/g,'$1 $2');
  return s.replace(/\s+/g,' ').trim();
}

function splitVoiceItems(s, group){
  if(!s) return [];
  let parts = s.split(/\s*(?:[,;，；\n]|แล้วก็|และก็|ต่อไป|ถัดไป|อีกอย่าง|อีกอัน|จากนั้น|ข้อต่อไป)\s*/)
               .map(x=>x.trim()).filter(Boolean);
  const qre = new RegExp('(\\d+(?:\\.\\d+)?\\s*(?:'+VOICE_UNITS+'))(?=\\s+\\S)','g');
  parts = parts.flatMap(p => p.replace(qre,'$1\n').split('\n').map(x=>x.trim()).filter(Boolean));
  if(group==='shopping'){
    parts = parts.flatMap(p => (/\d/.test(p) || !p.includes(' ')) ? [p] : p.split(/\s+/));
  }
  return parts;
}

function voiceStripLead(s){ return s.replace(/^[\s,;:：\-–]*(?:(?:คือ|ได้แก่|มี|ดังนี้|ว่า)\s*)*/,'').replace(/^[\s,;:：\-–]+/,''); }
function voiceStripTail(s){
  let prev;
  do{
    prev = s;
    s = s.replace(/(?:ลิ[สท]ต?์?|รายการ|ที่|ลง|ใน|ใส่|เพิ่ม|จด|บันทึก|เป็น)\s*$/,'').replace(/[\s,;:：\-–]+$/,'');
  }while(s !== prev);
  return s;
}

/* Parses one spoken sentence into [{group,text}]. Each list name starts a new group;
   text with no list name goes to defaultGroup (or keeps the group of the previous list name). */
function parseVoiceMulti(raw, defaultGroup){
  let s = voiceNormalize(raw);
  s = s.replace(/(?:to\s*-?\s*do\s*-?\s*list|todo\s*list|ทู\s*ดู\s*ลิ[สท]ต?์?)/ig,' ').replace(/\s+/g,' ').trim();
  const marks = [];
  for(const a of VOICE_ALIASES){
    const re = new RegExp(a.re.source, 'ig'); let m;
    while((m = re.exec(s)) !== null){
      if(!m[0]){ re.lastIndex++; continue; }
      marks.push({key:a.key, index:m.index, len:m[0].length});
    }
  }
  marks.sort((x,y)=> x.index - y.index || y.len - x.len);
  const kept = []; let end = -1;
  for(const m of marks){ if(m.index >= end){ kept.push(m); end = m.index + m.len; } }

  let pieces = [];
  if(kept.length === 0){
    pieces.push({key:null, text:s});
  }else{
    pieces.push({key:null, text:s.slice(0, kept[0].index)});
    kept.forEach((m,i)=>{
      const to = (i+1 < kept.length) ? kept[i+1].index : s.length;
      pieces.push({key:m.key, text:s.slice(m.index + m.len, to)});
    });
  }
  pieces.forEach((p,i)=>{
    p.text = voiceStripLead(p.text.trim());
    if(i < pieces.length-1) p.text = voiceStripTail(p.text);
    p.text = p.text.replace(/^[\s,;:：\-–]+|[\s,;:：\-–]+$/g,'');
  });
  // list name said at the very end ("... ลงของต้องซื้อ"): the text before it belongs to that list
  if(pieces.length === 2 && pieces[1].text === '' && pieces[0].text){
    pieces = [{key:pieces[1].key, text:pieces[0].text}];
  }
  const last = pieces[pieces.length-1];
  last.text = last.text.replace(/\s*(?:ครับ|ค่ะ|คะ|นะครับ|นะคะ|นะ)\s*$/,'').trim();

  let cur = defaultGroup || 'today';
  const entries = [], seen = new Set();
  for(const p of pieces){
    if(p.key) cur = p.key;
    let text = p.text;
    if(cur === 'shopping') text = text.replace(/^ซื้อ\s+/,'');
    for(const it of splitVoiceItems(text, cur)){
      const k = cur + '|' + it.toLowerCase();
      if(it && !seen.has(k)){ seen.add(k); entries.push({group:cur, text:it}); }
    }
  }
  return {entries, detected: kept.length > 0};
}



/* ===================== Pocket: รายจ่ายรายวัน ===================== */
/* Pocket เก็บรายจ่ายรายวันเป็นช่องคงที่: d[วันที่]['หมวด.ช่อง'] (Firestore ledgers/main) */
const TH_DIG = {'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9};
const TH_UNIT = {'สิบ':10,'ร้อย':100,'พัน':1000,'หมื่น':10000,'แสน':100000};
const TH_RUN = '(?:ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน)+';
function thWordsToNum(w){
  let total=0, cur=0;
  for(const t of w.match(new RegExp(TH_RUN.slice(3,-2),'g'))||[]){
    if(t in TH_DIG) cur = TH_DIG[t];
    else { if(cur===0 && t==='สิบ') cur=1; total += (cur||1)*TH_UNIT[t]; cur=0; }
  }
  return total+cur;
}
function moneyNormalize(s){
  return String(s||'').replace(/[๐-๙]/g, d=> String('๐๑๒๓๔๕๖๗๘๙'.indexOf(d)))
    .replace(/(\d),(\d{3})/g,'$1$2')
    .replace(new RegExp('('+TH_RUN+')(?=\\s*(?:บาท|$))','g'), m=>' '+thWordsToNum(m)+' ')
    .replace(/\s+/g,' ').trim();
}
function findMoney(s){
  const re = new RegExp('(\\d+(?:\\.\\d+)?)\\s*(บาท(?:ถ้วน)?)?','g'), unitRe = new RegExp('^\\s*(?:'+VOICE_UNITS+'|โมง|นาฬิกา|นาที|ชั่วโมง|คน|วัน|ครั้ง|รอบ)');
  let m, withBaht=null, last=null;
  while((m = re.exec(s))){
    if(s[m.index-1]==='-' || s[m.index+m[1].length]==='-') continue;          // 7-11
    if(!m[2] && unitRe.test(s.slice(m.index+m[0].length))) continue;        // 2 กล่อง
    const hit = {n:parseFloat(m[1]), baht:!!m[2]};
    if(m[2]) withBaht = hit; last = hit;
  }
  return withBaht || last;
}
/* เลือกช่องใน Pocket ตามคำที่พูด + วันธรรมดา/เสาร์อาทิตย์ + เวลา */
function pocketSlot(text){
  const t = text.toLowerCase(), now = new Date(), we = now.getDay()===0 || now.getDay()===6;
  const h = now.getHours() + now.getMinutes()/60;
  const ampm = /เย็น|ค่ำ|ขากลับ|กลับบ้าน/.test(t) ? 'เย็น' : /เช้า|ขาไป/.test(t) ? 'เช้า' : (h<12 ? 'เช้า' : 'เย็น');
  const meal = h<10.5 ? 'Breakfast' : h<16 ? 'Launch' : 'Dinner';
  const R = [
    [/ซื้อของ/,                                        'ใช้จ่ายอื่นๆ.ซื้อของ',          'ค่ากิน.Others'],
    [/express|เอ็กซ์?เพรส|ทางด่วน/,                     'ค่าเดินทาง.Express',            'ค่าเดินทาง.Express'],
    [/น้ำมัน|oil|ปั๊ม/,                                 'ใช้จ่ายอื่นๆ.อื่นๆ',            'ค่าเดินทาง.Oil'],
    [/mrt|เอ็ม\s*อาร์\s*ที|ใต้ดิน/,                     'ค่าเดินทาง.MRT '+ampm,          'ค่ากิน.Others'],
    [/bts|บี\s*ที\s*เอส|รถไฟฟ้า/,                       'ค่าเดินทาง.BTS '+ampm,          'ค่ากิน.Others'],
    [/วิน|มอ\s*ไซ|มอเตอร์ไซ|motorcycle/,               'ค่าเดินทาง.Motorcycle เช้า',    'ค่ากิน.Others'],
    [/รถตู้|van|แวน/,                                  'ค่าเดินทาง.Van',                'ค่ากิน.Others'],
    [/มื้อใหญ่|big\s*meal|บุฟเฟ่|ชาบู|หมูกระทะ|ปิ้งย่าง/, 'ค่ากิน.Dinner',                 'ค่ากิน.Big meal'],
    [/อาหารเช้า|ข้าวเช้า|มื้อเช้า|breakfast/,            'ค่ากิน.Breakfast',              'ค่ากิน.Small meal'],
    [/เที่ยง|กลางวัน|lunch|launch/,                    'ค่ากิน.Launch',                 'ค่ากิน.Small meal'],
    [/ข้าวเย็น|มื้อเย็น|มื้อค่ำ|dinner/,                 'ค่ากิน.Dinner',                 'ค่ากิน.Small meal'],
    [/มื้อเล็ก|small\s*meal|ข้าว|กาแฟ|ชา|ขนม|ก๋วยเตี๋ยว|อาหาร|มื้อ|ส้มตำ|น้ำ|ผลไม้|กิน/, 'ค่ากิน.'+meal, 'ค่ากิน.Small meal'],
    [/เซเว่น|7-?11|7-?eleven|โลตัส|lotus|บิ๊ก\s*ซี|big\s*c|ท็อปส์|tops|แม็คโคร|makro|ช้อปปี้|shopee|ลาซาด้า|lazada/, 'ใช้จ่ายอื่นๆ.ซื้อของ', 'ค่ากิน.Others']
  ];
  for(const [re,wd,wk] of R) if(re.test(t)) return {key: we?wk:wd, known:true};
  return {key: we ? 'ค่ากิน.Others' : 'ใช้จ่ายอื่นๆ.อื่นๆ', known:false};
}
/* คืนค่ารายจ่าย ถ้าประโยคนี้เป็นเรื่องเงิน ไม่งั้นคืน null */
function pocketParse(seg){
  const s = moneyNormalize(seg);
  if(!s || VOICE_ALIASES.some(a=>a.re.test(s))) return null;   // พูดชื่อลิสต์ = งาน to-do
  const m = findMoney(s); if(!m || !(m.n>0)) return null;
  const slot = pocketSlot(s);
  if(!m.baht && !slot.known) return null;                        // เลขเฉย ๆ ไม่มีคำว่าบาท และไม่รู้จักคำ → ไม่ใช่เงิน
  return {key:slot.key, n:m.n, label:slot.key.split('.').slice(1).join('.')};
}

let pdb = null;
function parseCfg(t){const c={},ok=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'],re=/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g;let m;while((m=re.exec(t||''))){if(ok.includes(m[1]))c[m[1]]=m[2]}return c}
function getPocketCfg(){
  for(const k of ['ftcfg','jd_pocket_cfg']){ try{ const c = JSON.parse(localStorage.getItem(k)||'null'); if(c && c.apiKey && c.projectId) return c; }catch(e){} }
  return null;
}
function initPocket(){
  if(pdb) return true;
  let cfg = getPocketCfg();
  if(!cfg){
    const t = prompt('เชื่อม Pocket ครั้งแรก: เปิดแอป Pocket → ⚙️ คัดลอกค่าในกล่องทั้งหมด แล้ววางที่นี่');
    cfg = parseCfg(t);
    if(!cfg.apiKey || !cfg.projectId){ setStatus('ยังไม่ได้เชื่อม Pocket — รายจ่ายยังไม่ถูกบันทึก'); return false; }
    localStorage.setItem('jd_pocket_cfg', JSON.stringify(cfg));
  }
  if(!firebase.firestore){ setStatus('โหลด Pocket ไม่ได้ (ต้องมีอินเทอร์เน็ต)'); return false; }
  try{
    const app = firebase.apps.find(a=>a.name==='pocket') || firebase.initializeApp(cfg, 'pocket');
    pdb = app.firestore().doc('ledgers/main');
    return true;
  }catch(e){ setStatus('เชื่อม Pocket ไม่สำเร็จ'); return false; }
}
function pocketAdd(e, sign){
  const inc = firebase.firestore.FieldValue.increment(sign*e.n);
  return pdb.set({d:{[e.date]:{[e.key]:inc}}}, {merge:true});
}

const LS_FB_CONFIG = 'jd_fb_config';
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8.5" y1="22" x2="15.5" y2="22"/></svg>';
let db = null, rec = null, listening = false, lastSaved = {}, pending = null, sessionItems = [];

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function newId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function setStatus(t){ $('qStatus').textContent = t; }
function getFbConfig(){ try{ return JSON.parse(localStorage.getItem(LS_FB_CONFIG) || 'null'); }catch(e){ return null; } }

function initDb(){
  if(db) return true;
  const cfg = getFbConfig();
  if(!cfg || !cfg.databaseURL){ setStatus('ยังไม่ได้เชื่อม Firebase — เปิดแอปหลักแล้วตั้งค่าที่ ⚙️ ก่อน'); return false; }
  try{
    if(!firebase.apps.some(a=>a.name==='[DEFAULT]')) firebase.initializeApp(cfg);
    db = firebase.database();
    return true;
  }catch(e){
    setStatus('เชื่อมระบบซิงก์ไม่สำเร็จ (ต้องมีอินเทอร์เน็ต)');
    return false;
  }
}

function renderResult(){
  $('qResult').innerHTML = sessionItems.slice().reverse().map(it => {
    const g = VOICE_GROUPS.find(x=>x.key===it.group);
    return '<div class="q-item"><span class="q-tag">' + esc(g ? g.label : it.group) + '</span><span>' + esc(it.text) + '</span></div>';
  }).join('');
}
function micUI(on){ $('qMic').classList.toggle('on', on); $('qMic').setAttribute('aria-label', on ? 'หยุดฟัง' : 'เริ่มพูด'); }

function startListening(auto){
  if(!SR){ setStatus('เบราว์เซอร์นี้ไม่รองรับไมค์ — เปิดหน้านี้ด้วย Chrome บน Android'); return; }
  if(listening) return;
  if(!initDb()) return;
  $('qHeard').textContent = '';
  $('qRetry').style.display = 'none';
  let heard = '', failed = false;
  const r = new SR();
  rec = r;
  r.lang = 'th-TH'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onstart = ()=>{ listening = true; micUI(true); setStatus('กำลังฟัง... พูดได้เลย'); };
  r.onresult = (e)=>{
    let t = '';
    for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + ' ';
    heard = t.trim();
    $('qHeard').textContent = heard;
  };
  r.onerror = (e)=>{
    if(e.error === 'aborted') return;
    failed = true;
    const perm = auto
      ? 'เริ่มฟังเองไม่ได้ — แตะปุ่มไมค์เพื่อเริ่มพูด (ถ้ายังไม่ได้ ให้เปิดสิทธิ์ไมโครโฟนให้ Chrome ในการตั้งค่าไซต์)'
      : 'ยังไม่ได้อนุญาตไมโครโฟน — เปิดสิทธิ์ไมโครโฟนให้ Chrome (การตั้งค่าไซต์) แล้วลองใหม่';
    const m = {
      'not-allowed': perm, 'service-not-allowed': perm,
      'no-speech': 'ไม่ได้ยินเสียง แตะไมค์แล้วพูดอีกครั้ง',
      'audio-capture': 'ไม่พบไมโครโฟนในเครื่อง',
      'network': 'ต้องต่ออินเทอร์เน็ตเพื่อแปลงเสียงเป็นข้อความ'
    };
    setStatus(m[e.error] || ('ฟังไม่สำเร็จ (' + e.error + ') ลองอีกครั้ง'));
  };
  r.onend = ()=>{
    listening = false; micUI(false);
    if(failed) return;
    if(!heard){ setStatus('ไม่ได้ยินอะไร แตะไมค์แล้วพูดอีกครั้ง'); return; }
    saveSpoken(heard);
  };
  try{ r.start(); }
  catch(err){ setStatus('เริ่มฟังไม่ได้ แตะไมค์อีกครั้ง'); }
}

function writeAll(tasks, exps){
  exps = exps || [];
  setStatus('กำลังบันทึก...');
  $('qRetry').style.display = 'none';
  let done = false;
  const slow = setTimeout(()=>{ if(!done) setStatus('ยังรอส่งขึ้นระบบ (เน็ตช้า) — อย่าเพิ่งปิดหน้านี้'); }, 8000);
  Promise.all(tasks.map(t => db.ref('tasks/' + t.id).set(t)).concat(exps.map(e => pocketAdd(e, 1))))
    .then(()=>{
      done = true; clearTimeout(slow);
      lastSaved = {tasks, exps}; pending = null;
      setStatus('บันทึกแล้ว ✓  ' + (tasks.length + exps.length) + ' รายการ');
      $('qUndo').style.display = '';
    })
    .catch(err=>{
      done = true; clearTimeout(slow);
      pending = {tasks, exps};
      setStatus('บันทึกไม่สำเร็จ: ' + (err && err.message ? err.message : 'ตรวจสอบอินเทอร์เน็ต'));
      $('qRetry').style.display = '';
    });
}

function saveSpoken(text){
  // แยกทีละช่วง ช่วงที่มีจำนวนเงิน → Pocket ที่เหลือ → to-do แบบเดิม
  const segs = String(text).split(/\s*(?:ต่อไป|ถัดไป|ข้อต่อไป)\s*/).filter(x=>x.trim());
  const exps = [], rest = [];
  segs.forEach(sg => { const e = pocketParse(sg); if(e) exps.push(e); else rest.push(sg); });
  const parsed = rest.length ? parseVoiceMulti(rest.join(' ต่อไป '), 'inbox') : {entries:[]};
  if(!parsed.entries.length && !exps.length){ setStatus('ไม่พบรายการ แตะไมค์แล้วพูดอีกครั้ง'); return; }
  if(parsed.entries.length && !initDb()) return;
  if(exps.length && !initPocket()) exps.length = 0;
  if(!parsed.entries.length && !exps.length) return;
  const date = todayStr();
  exps.forEach(e => { e.date = date; e.id = newId(); });
  const tasks = parsed.entries.map(e => ({id:newId(), text:e.text, group:e.group, status:'process', date}));
  tasks.forEach(t => sessionItems.push({group:t.group, text:t.text, id:t.id}));
  exps.forEach(e => sessionItems.push({group:'pocket', text:e.label + '  ' + e.n.toLocaleString('en-US') + ' ฿', id:e.id}));
  renderResult();
  $('qUndo').style.display = 'none';
  writeAll(tasks, exps);
}

$('qMic').innerHTML = MIC_SVG;
$('qMic').addEventListener('click', ()=>{
  if(listening){ try{ rec.stop(); }catch(e){} }
  else startListening(false);
});
$('qRetry').addEventListener('click', ()=>{ if(pending && (!pending.tasks.length || initDb())) writeAll(pending.tasks, pending.exps); });
$('qUndo').addEventListener('click', ()=>{
  if(!lastSaved.tasks) return;
  if(lastSaved.tasks.length && !initDb()) return;
  const ids = lastSaved.tasks.map(t=>t.id).concat(lastSaved.exps.map(e=>e.id));
  lastSaved.tasks.forEach(t => db.ref('tasks/' + t.id).remove());
  lastSaved.exps.forEach(e => pocketAdd(e, -1));
  sessionItems = sessionItems.filter(it => ids.indexOf(it.id) === -1);
  renderResult();
  lastSaved = {};
  $('qUndo').style.display = 'none';
  setStatus('ยกเลิกแล้ว ✓');
});

window.addEventListener('load', ()=>{
  if(initDb()){
    setStatus('กำลังเตรียมไมค์...');
    setTimeout(()=> startListening(true), 250);
    setTimeout(()=>{ if(!listening && /กำลังเตรียม/.test($('qStatus').textContent)) setStatus('แตะไมค์เพื่อเริ่มพูด'); }, 1800);
  }
});
</script>
