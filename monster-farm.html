<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecdc">
<title>ฟาร์มปลาโปรเจกต์ของฉัน</title>
<style>
* { box-sizing: border-box; }
body { margin:0; background:#f4ecdc; color:#3b3229; font-family:'Nunito','Anuphan',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
header { display:flex; align-items:center; gap:10px; padding:12px 14px; position:sticky; top:0; z-index:5; background:#f4ecdc; border-bottom:2px solid #d9cbb0; }
header h1 { font-size:16px; margin:0; letter-spacing:.5px; flex:1; }
header a.back, button.ghost { color:#3b3229; text-decoration:none; font-weight:800; background:#e7dac2; border:0; padding:6px 10px; border-radius:10px; cursor:pointer; font:inherit; }
nav { display:flex; gap:6px; padding:8px 14px; }
nav button { flex:1; padding:8px 0; border:0; border-radius:10px; background:#e7dac2; color:#6b5b48; font-weight:800; cursor:pointer; font:inherit; }
nav button.on { background:#3b3229; color:#f4ecdc; }
main { padding:8px 12px 40px; }
.banner { background:#f3d9a4; color:#6b4a12; font-size:12px; padding:8px 10px; border-radius:10px; margin-bottom:10px; display:none; }
.banner.show { display:block; }
.hint { font-size:12px; color:#7a6a55; margin:0 2px 10px; }

/* บ่อปลาแต่ละโซน */
.pond { position:relative; height:210px; margin-bottom:14px; border-radius:22px; overflow:hidden;
  background:radial-gradient(circle at 25% 20%, rgba(255,255,255,.7), transparent 55%),
             radial-gradient(circle at 80% 90%, rgba(60,40,20,.08), transparent 50%), var(--pond);
  border:2px solid rgba(60,40,20,.18); box-shadow: inset 0 0 30px rgba(60,40,20,.08); }
.pond h2 { position:absolute; top:8px; left:12px; margin:0; font-size:11px; letter-spacing:1.5px; color:#3b3229;
  background:rgba(255,255,255,.7); padding:3px 9px; border-radius:10px; z-index:2; }
.fish { position:absolute; width:70px; cursor:pointer; transition:left 6s ease-in-out, top 6s ease-in-out; }
.flip { width:100%; transition:transform .4s ease; }
.flip.left { transform:scaleX(-1); }
.wrap { width:100%; position:relative; }
.wrap svg { width:100%; height:100%; overflow:visible; display:block; }
.wrap img.sp { width:100%; height:auto; display:block; pointer-events:none; }
.fish.super .wrap { filter:drop-shadow(0 0 6px rgba(255,205,70,.9)); }
.tag { position:absolute; left:50%; bottom:-16px; transform:translateX(-50%); font-size:10px; white-space:nowrap;
  background:rgba(255,255,255,.75); color:#3b3229; padding:1px 6px; border-radius:6px; pointer-events:none; }
.jump { animation:jump .9s ease-out; }
@keyframes jump {
  0%   { transform:translateY(0) rotate(0); }
  20%  { transform:translateY(-34px) rotate(-14deg); }
  40%  { transform:translateY(-8px) rotate(12deg); }
  60%  { transform:translateY(-26px) rotate(-10deg); }
  80%  { transform:translateY(-4px) rotate(6deg); }
  100% { transform:translateY(0) rotate(0); }
}
.wiggle { animation:wiggle .5s ease-in-out; }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
.drop { position:absolute; width:6px; height:6px; border-radius:50%; background:#8fd3ff; pointer-events:none; animation:drop .7s ease-out forwards; }
@keyframes drop { to { transform:translate(var(--dx), var(--dy)); opacity:0; } }

/* ทะเบียนและไข่ */
.card { display:flex; gap:10px; background:#fbf6ea; border:1px solid #e3d5b8; border-radius:16px; padding:10px; margin-bottom:10px; cursor:pointer; }
.card .pic { width:72px; height:60px; flex:none; background:#efe4cc; border-radius:12px; display:grid; place-items:center; overflow:hidden; }
.card .pic img { width:100%; height:100%; object-fit:contain; }
.card .pic svg { width:70px; height:52px; }
.card .body { min-width:0; flex:1; }
.card b { display:block; font-size:14px; }
.card small { color:#7a6a55; font-size:11.5px; display:block; line-height:1.4; }
.pill { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:8px; background:#f2c94c; color:#3b3229; margin:2px 4px 2px 0; }
.pill.gray { background:#d9cbb0; }
.egg-form { background:#fbf6ea; border:1px solid #e3d5b8; border-radius:16px; padding:10px; margin-bottom:12px; display:grid; gap:6px; }
input, select, textarea { width:100%; padding:8px 10px; border-radius:10px; border:1px solid #cdbd9c; background:#fffdf6; color:#3b3229; font:inherit; }
button.act { padding:9px 12px; border:0; border-radius:10px; background:#3b3229; color:#f4ecdc; font-weight:800; cursor:pointer; font:inherit; }

/* ป๊อปอัป */
.modal { position:fixed; inset:0; background:rgba(40,28,15,.45); display:none; align-items:flex-end; justify-content:center; z-index:10; }
.modal.show { display:flex; }
.sheet { width:100%; max-width:520px; background:#f4ecdc; border-radius:20px 20px 0 0; padding:16px; max-height:90vh; overflow:auto; }
.sheet h3 { margin:0 0 10px; font-size:15px; }
.sheet label { font-size:11.5px; color:#7a6a55; display:block; margin:8px 0 3px; }
.big { width:100%; height:170px; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.8), transparent 60%), var(--pond, #efe4cc); border-radius:16px; display:grid; place-items:center; margin-bottom:10px; }
.big svg { width:180px; height:120px; }
.big img.sp { height:150px; width:auto; }
.row { display:flex; gap:8px; margin-top:12px; }
.row button { flex:1; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html#self">←</a>
  <h1>ฟาร์มปลาโปรเจกต์</h1>
  <button class="ghost" id="reload" type="button">↻</button>
</header>
<nav>
  <button class="on" data-tab="farm">บ่อปลา</button>
  <button data-tab="dex">ทะเบียน</button>
  <button data-tab="egg">ไข่ไอเดีย</button>
</nav>
<main>
  <div class="banner" id="banner">ยังไม่ได้ตั้งค่า API_URL จึงแสดงข้อมูลตัวอย่าง และการแก้ไขจะยังไม่บันทึกลงชีท</div>
  <p class="hint">แตะปลาหนึ่งครั้งให้มันกระโดด แตะสองครั้งเพื่อดูรายละเอียด</p>
  <section id="tab-farm"></section>
  <section id="tab-dex" hidden></section>
  <section id="tab-egg" hidden></section>
</main>

<div class="modal" id="editor"><div class="sheet" id="editorBody"></div></div>
<div class="modal" id="detail"><div class="sheet" id="detailBody"></div></div>

<script>
// ===== ตั้งค่า: Web app URL ของ Apps Script และรหัสลับ (ต้องตรงกับ SECRET ใน Code.gs) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxTn09gumpZgoegsQd1b7zieiIBCIiR1SdiKnbilZ-aPpNVW448qfeCsjAWG_nMr7MT/exec';
const TOKEN   = 'monster0244@';

// ---------- โซนและสี ----------
const ZONES = [
  { type:'App',        label:'APP',        pond:'#f6d6b0', hue:24  },
  { type:'Micro site', label:'MICRO SITE', pond:'#cfe6ef', hue:200 },
  { type:'System',     label:'SYSTEM',     pond:'#d3ead0', hue:138 },
  { type:'Others',     label:'OTHERS',     pond:'#e3d6ef', hue:272 },
];
const PHASE_TH = ['ไข่','Baby (Prototype)','Child (Develop)','Adult (Decorate/Function)','Super (Publish)'];
const PHASE_SIZE = [44, 54, 66, 80, 96];   // ความกว้างของปลาในบ่อ (px)
const WANDER_MS = 6000;                    // ความเร็วการว่าย: ช้าลงกว่าเดิม

let S = { projects:[], monsters:[], ideas:[], history:[] };
let timers = [];

const DEMO = {
  projects:[
    {code:'P1',name:'Branch Booth Info',type:'Micro site',desc:'All information of Branch booth'},
    {code:'P2',name:'Calorie tracker',type:'App',desc:'Calory eat and exercise count'},
    {code:'P6',name:'To Do List',type:'App',desc:'Working, personal list'},
    {code:'P13',name:'P mass',type:'Others',desc:'Automatic post on Youtube'},
    {code:'P14',name:'PhaTaem',type:'System',desc:'Automatic post on Youtube'},
  ],
  monsters:[{Code:'P2',Phase:4},{Code:'P6',Phase:3},{Code:'P1',Phase:2}],
  ideas:[{ID:'demo1',Name:'AI Team Chat',Type:'App',Note:'ห้องแชททีม AI',Status:'egg'}],
  history:[]
};

// ---------- การเชื่อมต่อ ----------
async function api(action, data={}) {
  if (!API_URL) return null;
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ token:TOKEN, action, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

async function load() {
  if (!API_URL) {
    document.getElementById('banner').classList.add('show');
    S = JSON.parse(JSON.stringify(DEMO));
  } else {
    const res = await fetch(API_URL);
    S = await res.json();
  }
  render();
}

function monsterOf(code) { return S.monsters.find(m => String(m.Code) === code) || null; }
function phaseOf(code) {
  const m = monsterOf(code);
  const p = m ? Number(m.Phase) : 1;
  return isNaN(p) ? 1 : Math.max(0, Math.min(4, p));
}
function zoneOf(type) { return ZONES.find(z => z.type === type) || ZONES[3]; }

// ---------- วาดปลาด้วย SVG จากโค้ด (ไม่ต้องใช้ไฟล์ภาพ) ----------
function hash(str) { let h=2166136261; for (const c of str) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- มอนสเตอร์ภาพพิกเซล (assets/farm/<species>/<เฟส 0-4>.webp) ----------
// แม่แบบแต่ละโซน ถ้าโปรเจกต์ไม่ได้กำหนด Species ไว้ในชีต ระบบจะเลือกจากรหัสโปรเจกต์
const POOL = {
  'App':        ['fire', 'phoenix', 'tiger_gold', 'mushroom', 'tiger_white'],
  'Micro site': ['dragon_water', 'dragon_sea', 'wolf_ice', 'dragon_myth', 'kitsune_sky'],
  'System':     ['golem_moss', 'golem_crystal', 'wolf_forest', 'dragon_orient', 'turtle'],
  'Others':     ['owl', 'kitsune_lunar'],
};
const ALL_SPECIES = Object.values(POOL).flat();
const HUE_SHIFT = [0, 70, 150, 215, 290];  // เปลี่ยนสีให้โปรเจกต์ที่ใช้แม่แบบเดียวกันดูไม่เหมือนกัน

function speciesOf(code, type) {
  const m = monsterOf(code);
  if (m && ALL_SPECIES.includes(m.Species)) return m.Species;
  const pool = POOL[type] || POOL['Others'];
  return pool[hash(code) % pool.length];
}

function spriteHTML(code, type, phase, m) {
  const sp = speciesOf(code, type);
  const explicit = m && ALL_SPECIES.includes(m.Species);
  const deg = explicit ? 0 : HUE_SHIFT[(hash(code) >>> 8) % HUE_SHIFT.length];
  return `<img class="sp" src="assets/farm/${sp}/${phase}.webp" alt="" style="filter:hue-rotate(${deg}deg)">`;
}

function eggSVG(code, type) {
  const r = rng(hash(code));
  const zone = zoneOf(type);
  const spot = `hsl(${zone.hue} 55% 60%)`;
  let dots = '';
  for (let i=0;i<5;i++) dots += `<circle cx="${40+r()*40}" cy="${35+r()*40}" r="${3+r()*2}" fill="${spot}" opacity=".8"/>`;
  return `<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="42" rx="22" ry="27" fill="#fbf3df" stroke="#8a7a60" stroke-width="2"/>${dots}</svg>`;
}

// ---------- วาดหน้าต่างๆ ----------
function render() { renderFarm(); renderDex(); renderEgg(); }

function renderFarm() {
  const el = document.getElementById('tab-farm');
  el.innerHTML = '';
  timers.forEach(clearInterval); timers = [];
  ZONES.forEach(z => {
    const pond = document.createElement('div');
    pond.className = 'pond';
    pond.style.setProperty('--pond', z.pond);
    pond.innerHTML = `<h2>${z.label}</h2>`;
    S.projects.filter(p => (p.type || 'Others') === z.type).forEach(p => {
      pond.appendChild(makeFish(p));
    });
    el.appendChild(pond);
  });
}

function makeFish(p) {
  const ph = phaseOf(p.code);
  const m = monsterOf(p.code) || {};
  const node = document.createElement('div');
  node.className = 'fish' + (ph === 4 ? ' super' : '');
  node.style.width = Math.round(PHASE_SIZE[ph] * 1.2) + 'px';
  node.innerHTML = `<div class="flip"><div class="wrap">${spriteHTML(p.code, p.type, ph, m)}</div></div><span class="tag">${escapeHtml(p.code)} ${escapeHtml(p.name)}</span>`;
  node.dataset.code = p.code;
  node.dataset.x = 20 + Math.random()*60;
  node.style.left = node.dataset.x + '%';
  node.style.top = (22 + Math.random()*50) + '%';
  attachTap(node, p.code);
  wander(node);
  return node;
}

// ว่ายช้าๆ เลือกจุดใหม่เป็นระยะ และหันหัวตามทิศทาง
function wander(node) {
  const pick = () => {
    const nx = 4 + Math.random()*80, ny = 20 + Math.random()*56;
    const flip = node.querySelector('.flip');
    const oldX = parseFloat(node.dataset.x);
    if (nx < oldX - 2) flip.classList.add('left');
    else if (nx > oldX + 2) flip.classList.remove('left');
    node.dataset.x = nx;
    node.style.left = nx + '%';
    node.style.top = ny + '%';
  };
  pick();
  timers.push(setInterval(pick, WANDER_MS + Math.random()*3000));
}

// แตะหนึ่งครั้ง = กระโดด, แตะสองครั้ง = รายละเอียด
let lastTap = { code:null, t:0 }, tapTimer = null;
function attachTap(node, code) {
  node.addEventListener('click', e => {
    e.stopPropagation();
    const now = Date.now();
    if (lastTap.code === code && now - lastTap.t < 380) {
      clearTimeout(tapTimer); lastTap = { code:null, t:0 };
      openDetail(code);
      return;
    }
    lastTap = { code, t:now };
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => jump(node), 260);
  });
}

function jump(node) {
  const wrap = node.querySelector('.wrap');
  wrap.classList.remove('jump');
  void wrap.offsetWidth;
  wrap.classList.add('jump');
  splash(node);
  setTimeout(() => wrap.classList.remove('jump'), 950);
}

function splash(node) {
  const pond = node.parentElement;
  const rect = node.getBoundingClientRect();
  const pr = pond.getBoundingClientRect();
  const left = rect.left - pr.left + rect.width/2, top = rect.top - pr.top + rect.height/3;
  for (let i=0;i<7;i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    const ang = (Math.PI*2*i)/7;
    d.style.left = left + 'px'; d.style.top = top + 'px';
    d.style.setProperty('--dx', (Math.cos(ang)*34) + 'px');
    d.style.setProperty('--dy', (Math.sin(ang)*34 - 12) + 'px');
    pond.appendChild(d);
    setTimeout(() => d.remove(), 800);
  }
}

// ---------- ทะเบียน ----------
function renderDex() {
  const el = document.getElementById('tab-dex');
  el.innerHTML = '';
  S.projects.forEach(p => {
    const m = monsterOf(p.code) || {};
    const ph = phaseOf(p.code);
    const card = document.createElement('div');
    card.className = 'card';
    const pic = m.IconFileId
      ? `<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(m.IconFileId)}&sz=w200" alt="">`
      : spriteHTML(p.code, p.type, ph, m);
    card.innerHTML = `<div class="pic">${pic}</div>
      <div class="body"><b>${escapeHtml(p.code)} · ${escapeHtml(p.name)}</b>
      <span class="pill">${PHASE_TH[ph]}</span><span class="pill gray">${escapeHtml(p.type||'')}</span>
      <small>${escapeHtml(p.desc||'')}</small></div>`;
    card.onclick = () => openDetail(p.code);
    el.appendChild(card);
  });
}

function renderEgg() {
  const el = document.getElementById('tab-egg');
  el.innerHTML = `
    <div class="egg-form">
      <input id="ideaName" placeholder="ชื่อไอเดีย">
      <select id="ideaType">${ZONES.map(z=>`<option>${z.type}</option>`).join('')}</select>
      <textarea id="ideaNote" rows="2" placeholder="หมายเหตุ"></textarea>
      <button class="act" id="addIdea" type="button">🥚 ตุนไข่ใหม่</button>
    </div>`;
  S.ideas.filter(i => (i.Status||'egg') === 'egg').forEach(i => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="pic">${eggSVG(String(i.ID), i.Type || 'Others')}</div>
      <div class="body"><b>${escapeHtml(i.Name)}</b>
      <span class="pill">ไข่</span><span class="pill gray">${escapeHtml(i.Type||'')}</span>
      <small>${escapeHtml(i.Note||'')}</small>
      <div style="margin-top:6px"><button class="act" data-hatch="${escapeHtml(i.ID)}" type="button">🐣 ฟักไข่</button></div></div>`;
    el.appendChild(d);
  });
  el.querySelector('#addIdea').onclick = async () => {
    const name = document.getElementById('ideaName').value.trim();
    if (!name) return;
    const data = { name, type: document.getElementById('ideaType').value, note: document.getElementById('ideaNote').value };
    if (!API_URL) { S.ideas.push({ ID:'demo'+Date.now(), Name:data.name, Type:data.type, Note:data.note, Status:'egg' }); return render(); }
    await run(() => api('addIdea', data));
  };
  el.querySelectorAll('[data-hatch]').forEach(b => b.onclick = async () => {
    await run(() => api('hatchIdea', { id: b.dataset.hatch }));
  });
}

// ---------- รายละเอียด ----------
function openDetail(code) {
  const p = S.projects.find(x => x.code === code) || { code, name:'', type:'', desc:'' };
  const m = monsterOf(code) || {};
  const ph = phaseOf(code);
  const zone = zoneOf(p.type);
  const pic = m.IconFileId
    ? `<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(m.IconFileId)}&sz=w400" alt="" style="height:150px">`
    : spriteHTML(code, p.type, ph, m);
  document.getElementById('detailBody').innerHTML = `
    <div class="big" style="--pond:${zone.pond}">${pic}</div>
    <h3>${escapeHtml(code)} · ${escapeHtml(p.name)}</h3>
    <span class="pill">${PHASE_TH[ph]}</span><span class="pill gray">${escapeHtml(p.type||'')}</span>
    <label>รายละเอียด</label>
    <div>${escapeHtml(p.desc || '—')}</div>
    <label>วันเกิด</label>
    <div>${escapeHtml(p.birthday || '—')}</div>
    <label>ลิงก์แอป</label>
    <div>${m.Url ? `<a href="${escapeHtml(m.Url)}" target="_blank" rel="noopener" style="color:#7a4a00">${escapeHtml(m.Url)}</a>` : '—'}</div>
    <label>โน้ต</label>
    <div>${escapeHtml(m.Note || '—')}</div>
    <div class="row">
      <button class="act" style="background:#e7dac2;color:#3b3229" id="dClose" type="button">ปิด</button>
      <button class="act" id="dEdit" type="button">แก้ไขสถานะ</button>
    </div>`;
  document.getElementById('detail').classList.add('show');
  document.getElementById('dClose').onclick = () => document.getElementById('detail').classList.remove('show');
  document.getElementById('dEdit').onclick = () => {
    document.getElementById('detail').classList.remove('show');
    openEditor(code);
  };
}

// ---------- แก้สถานะ ----------
function openEditor(code) {
  const p = S.projects.find(x => x.code === code) || { code, name:'', type:'', desc:'' };
  const m = monsterOf(code) || {};
  const ph = phaseOf(code);
  document.getElementById('editorBody').innerHTML = `
    <h3>${escapeHtml(code)} · ${escapeHtml(p.name)}</h3>
    <label>เฟส</label>
    <select id="ePhase">${PHASE_TH.map((n,i)=>`<option value="${i}" ${i===ph?'selected':''}>${i} · ${n}</option>`).join('')}</select>
    <label>ชุด (none หรือ hat)</label>
    <select id="eOutfit"><option value="none" ${m.Outfit==='none'?'selected':''}>ไม่มี</option><option value="hat" ${m.Outfit==='hat'?'selected':''}>หมวก</option></select>
    <label>สีชุด / สีหลัก</label>
    <input id="eColor" type="color" value="${m.Color || '#e0463c'}">
    <label>IconFileId ของไอคอนใน Drive</label>
    <input id="eIcon" value="${escapeHtml(m.IconFileId || '')}">
    <label>ลิงก์แอป (Url)</label>
    <input id="eUrl" value="${escapeHtml(m.Url || '')}">
    <label>โน้ต / ประวัติ</label>
    <textarea id="eNote" rows="3">${escapeHtml(m.Note || '')}</textarea>
    <div class="row">
      <button class="act" style="background:#e7dac2;color:#3b3229" id="eCancel" type="button">ปิด</button>
      <button class="act" id="eSave" type="button">บันทึก</button>
    </div>`;
  document.getElementById('editor').classList.add('show');
  document.getElementById('eCancel').onclick = () => document.getElementById('editor').classList.remove('show');
  document.getElementById('eSave').onclick = async () => {
    await run(async () => {
      await api('setPhase', { code, phase: Number(document.getElementById('ePhase').value), note: document.getElementById('eNote').value });
      return api('setStyle', { code, outfit: document.getElementById('eOutfit').value, color: document.getElementById('eColor').value,
        iconFileId: document.getElementById('eIcon').value.trim(), url: document.getElementById('eUrl').value.trim() });
    });
    document.getElementById('editor').classList.remove('show');
  };
}

// ---------- บันทึกและโหลดซ้ำ ----------
async function run(fn) {
  try {
    const r = await fn();
    if (r && r.code) { await load(); alert('ฟักแล้ว รหัสใหม่ ' + r.code); return; }
    if (API_URL) await load(); else render();
  } catch (e) { alert('ผิดพลาด: ' + e.message); }
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- แท็บ ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['farm','dex','egg'].forEach(t => document.getElementById('tab-'+t).hidden = (t !== b.dataset.tab));
});
document.getElementById('reload').onclick = load;
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));
load();
</script>
