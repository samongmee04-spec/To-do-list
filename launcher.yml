name: Build My Home launcher APK

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: launcher
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk MyHome.apk
          gh release delete launcher --yes --cleanup-tag || true
          gh release create launcher MyHome.apk \
            --title "My Home launcher (build ${{ github.run_number }})" \
            --notes "ดาวน์โหลด MyHome.apk แล้วติดตั้ง จากนั้นกดปุ่ม Home แล้วเลือก My Home"
